name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble Native Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        run: |
          echo "Downloading official Gradle 8.5 distribution..."
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle-8.5-bin.zip
          unzip -q /tmp/gradle-8.5-bin.zip -d /opt/
          echo "/opt/gradle-8.5/bin" >> $GITHUB_PATH
          /opt/gradle-8.5/bin/gradle -v

      - name: Configure Android SDK
        run: |
          mkdir -p android
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > android/local.properties
          cat android/local.properties

      - name: Build Android Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          GRADLE_OPTS: "-Xmx3072m -XX:MaxMetaspaceSize=768m"
        run: |
          cd android
          gradle assembleDebug --stacktrace --no-daemon

      - name: Locate and Archive APK
        run: |
          mkdir -p artifacts
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found APK: $APK_PATH"
            cp "$APK_PATH" artifacts/CalculatorAppBlocker.apk
            ls -lh artifacts/CalculatorAppBlocker.apk
          else
            echo "Error: No APK was generated in android/app/build/outputs/apk/debug"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorAppBlocker-Android-APK
          path: artifacts/CalculatorAppBlocker.apk
          retention-days: 30

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: success()
        continue-on-error: true
        with:
          tag_name: latest-apk
          name: "Calculator AppBlocker - Latest Android APK"
          body: |
            ### 📱 Calculator AppBlocker
            Built automatically via GitHub Actions.
            
            - **Target Device**: Samsung Galaxy M31 / Android 12 (One UI 4.1) & All Android Devices
            - **Supported Apps**: All installed Android apps, social, games, browsers, and custom package names
            - **Architecture**: Universal APK (ARM64 / ARMv7 / x86_64)
            - **Safety**: Purely client-side, zero personal data read, uses standard Android Accessibility APIs.
            
            #### 📥 Download:
            Download **`CalculatorAppBlocker.apk`** below to install directly on your device.
          files: artifacts/CalculatorAppBlocker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
